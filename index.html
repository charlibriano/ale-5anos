:root{
  --bg:#0d1020; --ink:#f6eedd; --muted:rgba(246,238,221,.62); --track:rgba(246,238,221,.22);
  --fill:#f07fa0; --btn-bg:#f07fa0; --btn-ink:#fff; --err-bg:#7a1f2b; --err-ink:#fff;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1020; } }
:root[data-theme="dark"]{ --bg:#0d1020; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased}
#cv{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.app{position:relative; z-index:1; height:100%; display:grid; grid-template-rows:auto 1fr auto; max-width:900px; margin:0 auto; padding:18px 22px 18px; pointer-events:none}
.app > header, .app > .controls{pointer-events:auto}
header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; min-height:28px; transition:opacity .8s}
.song{font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-size:1.25rem}
.section{font-size:.85rem; color:var(--muted); display:none}
body.embedded header{justify-content:flex-start}
.controls{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:16px; padding-top:8px; transition:opacity .8s}
body.playing.idle .controls, body.playing.idle header{opacity:0}
body.playing.idle{cursor:none}
.play{width:56px; height:56px; border-radius:50%; border:0; cursor:pointer; background:var(--btn-bg); color:var(--btn-ink); display:grid; place-items:center}
.play svg{width:22px; height:22px}
.bar{display:grid; gap:6px}
.track{position:relative; height:22px; cursor:pointer; touch-action:none}
.track::before,.track .fill{content:""; position:absolute; left:0; top:50%; height:3px; margin-top:-1.5px; border-radius:3px}
.track::before{right:0; background:var(--track)}
.track .fill{background:var(--fill); width:0}
.times{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
button{font-family:var(--sans)}
button:focus-visible,.track:focus-visible{outline:2px solid var(--fill); outline-offset:3px}
body.paper{--ink:#3a2a40; --muted:rgba(58,42,64,.65); --track:rgba(58,42,64,.2); --fill:#e0507a; --btn-bg:#e0507a; --btn-ink:#fff}
.cover{position:fixed; inset:0; z-index:5; display:grid; place-items:end center; text-align:center; padding:24px 24px calc(34px + env(safe-area-inset-bottom,0px)); transition:opacity .9s; background:transparent}
.cover.tap{background:rgba(245,238,224,.6); place-items:center}
.cover.tap::before,.cover.tap p{display:none}
.cover::before{content:""; position:absolute; left:0; right:0; bottom:0; height:34%; background:linear-gradient(to top, rgba(242,240,234,.95), rgba(242,240,234,0)); pointer-events:none}
.cover > div{position:relative}
.cover h1{display:none}
.cover.gone{opacity:0; pointer-events:none}
.cover.end p{display:none}
.cover h1{font-family:"Great Vibes", cursive; font-weight:400; font-size:clamp(3.4rem,15vw,7.5rem); line-height:1; margin:0 0 30px; color:#f3d48f; text-shadow:0 0 36px rgba(227,184,101,.45)}
.start{display:inline-flex; align-items:center; gap:12px; border:0; cursor:pointer; border-radius:999px; padding:14px 26px 14px 18px; background:var(--btn-bg); color:var(--btn-ink); font-size:1.05rem; font-weight:600}
.start span.ic{width:34px; height:34px; border-radius:50%; background:var(--btn-ink); color:var(--btn-bg); display:grid; place-items:center}
.start svg{width:14px; height:14px; margin-left:2px}
.start[disabled]{opacity:.6; cursor:wait}
.cover p{color:#5a4833; font-size:.9rem; margin:18px 0 0}
body.covered #player{opacity:0; pointer-events:none}
#player{transition:opacity .9s}
.draft{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom,0px)); z-index:2; font-size:.8rem; color:var(--muted); background:rgba(0,0,0,.5); padding:6px 12px; border-radius:999px; white-space:nowrap}
.back{color:inherit; text-decoration:none; font-size:.95rem; font-weight:600; opacity:.85}
.cover .back{color:var(--muted)}
[hidden]{display:none !important}
.err{position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); z-index:9; background:var(--err-bg); color:var(--err-ink); padding:12px 14px; border-radius:12px; font-size:.9rem; line-height:1.4}
.wish{position:fixed; inset:0; z-index:8; background:#141a3a; color:#fff; font-family:"Gochi Hand","Comic Sans MS",cursive; touch-action:none; transition:opacity .8s}
.wish.out{opacity:0; pointer-events:none}
.wish canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.wish .wtop{position:absolute; left:0; right:0; top:calc(14px + env(safe-area-inset-top,0px)); text-align:center; padding:0 56px; pointer-events:none}
.wish .wtop h2{margin:0; font-weight:400; font-size:clamp(2rem,7vw,3.6rem); line-height:1.05; color:#ffd60a; -webkit-text-stroke:0; text-shadow:0 3px 0 #3a2a40, 0 0 22px rgba(255,214,10,.35)}
.wish .wtop p{margin:.35em 0 0; font-size:clamp(1.05rem,3.6vw,1.6rem); line-height:1.25; color:#fff; text-shadow:0 2px 0 #3a2a40}
.wish .wbot{position:absolute; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:grid; justify-items:center; gap:8px; padding:0 16px}
.wish .wbot .start{font-family:"Gochi Hand","Comic Sans MS",cursive; font-size:clamp(1.2rem,4vw,1.6rem); font-weight:400; padding:12px 28px}
.wish .wbot .note{font-size:clamp(.95rem,3vw,1.2rem); color:#fff; text-shadow:0 2px 0 #3a2a40; margin:0}
.wish .wx{position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer; background:rgba(255,255,255,.2); color:#fff; font-size:22px; line-height:1}
.wish .wcard{position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:6%; background:rgba(255,255,255,.12); animation:wpop .5s ease}
.wish .wcard > div{background:#fffdf7; color:#3a2a40; border-radius:22px; box-shadow:0 14px 34px rgba(0,0,0,.35); padding:28px 26px 24px; text-align:center; display:grid; gap:10px; max-width:min(92vw,460px)}
.wish .wcard .k{font-size:1.15rem; color:#e0507a}
.wish .wcard .t{font-size:clamp(2rem,8vw,3rem); line-height:1.05; margin:0; color:#e0507a}
.wish .wcard .x{font-size:1.3rem; margin:0}
.wish .wcard .rowb{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px}
.wish .wcard .start{font-family:"Gochi Hand","Comic Sans MS",cursive; font-size:1.25rem; font-weight:400; padding:10px 22px}
.wish .wcard .ghost{background:transparent; color:#e0507a; box-shadow:inset 0 0 0 2px #e0507a}
@keyframes wpop{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}

    CANDLES.forEach(function(c){ if(c.lit) lit++; });
    var dk = done ? Math.min(1, (now - doneAt)/1600) : 0, glow = lit/5;
    var bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, mix('#141a3a', '#ff9ecb', dk)); bg.addColorStop(1, mix('#2d2457', '#ffe3a3', dk)); g.fillStyle = bg; g.fillRect(0, 0, w, h);
    stars.forEach(function(s){ g.globalAlpha = (1 - dk)*(.45 + .45*Math.sin(now/600 + s.ph)); g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x*w, s.y*h, s.r, 0, TAU); g.fill(); }); g.globalAlpha = 1;
    var u = Math.min(w*.66, h*.46), cx = w/2, base = h*.8, tY = base;      // mesa rosa na frente, bolo em cima
    // luz quente das velinhas
    var wg = g.createRadialGradient(cx, base - u*.8, 0, cx, base - u*.8, u*1.3); wg.addColorStop(0, 'rgba(255,200,110,' + (.32*glow) + ')'); wg.addColorStop(1, 'rgba(255,200,110,0)'); g.fillStyle = wg; g.fillRect(0, 0, w, h);
    g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = Math.max(2, u*.014);
    // prato
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(cx, base - u*.005, u*.62, u*.07, 0, 0, TAU); g.fill(); g.stroke();
    // bolo: duas camadas
    var w1 = u*1.0, h1 = u*.34, w2 = u*.68, h2 = u*.27, y1 = base - h1 - u*.01, y2 = y1 - h2;
    g.fillStyle = '#ff6fbf'; rr(cx - w1/2, y1, w1, h1, u*.04); g.fill(); g.stroke();
    g.fillStyle = '#ffe14d'; rr(cx - w2/2, y2, w2, h2, u*.04); g.fill(); g.stroke();
    g.fillStyle = '#fff'; [[cx - w1/2, y1, w1, 11],[cx - w2/2, y2, w2, 8]].forEach(function(L){ g.beginPath(); for(var k=0;k<=L[3];k++){ g.arc(L[0] + L[2]*(k + .5)/(L[3] + 1)*(L[3] + 1)/L[3]*.9 + L[2]*.05, L[1] + u*.012, u*.036, 0, Math.PI); } g.fill(); });
    for(i=0;i<14;i++){ g.fillStyle = PAL[i % 5]; g.save(); g.translate(cx - w1*.42 + (i + .5)*w1*.84/14 + (R01(i)*.02 - .01)*u, y1 + h1*(.5 + R01(i + 9)*.35)); g.rotate(R01(i + 3)*3); g.fillRect(-u*.014, -u*.006, u*.028, u*.012); g.restore(); }
    for(i=0;i<9;i++){ g.fillStyle = PAL[(i + 2) % 5]; g.beginPath(); g.arc(cx - w2*.4 + i*w2*.1, y2 + h2*.62, u*.012, 0, TAU); g.fill(); }
    g.font = '400 ' + (u*.16) + 'px ' + FONT; g.textAlign = 'center'; g.lineWidth = Math.max(3, u*.03); g.strokeStyle = '#c4306f'; g.strokeText('Alê', cx, y1 + h1*.62); g.fillStyle = '#fff'; g.fillText('Alê', cx, y1 + h1*.62); g.strokeStyle = INK; g.lineWidth = Math.max(2, u*.014);
    // velinhas (5 coloridas) em cima da camada de cima
    CANDLES.forEach(function(c, k){ var x = cx + (k - 2)*w2*.19, ch = u*.2, cw = u*.05, y0 = y2 - ch + u*.01; c.x = x; c.y = y0 - u*.09;
      g.fillStyle = c.col; rr(x - cw/2, y0, cw, ch, cw*.3); g.fill(); g.stroke(); g.fillStyle = 'rgba(255,255,255,.55)'; for(var s=0;s<3;s++){ g.beginPath(); g.moveTo(x - cw/2, y0 + ch*(.2 + s*.25)); g.lineTo(x + cw/2, y0 + ch*(.12 + s*.25)); g.lineTo(x + cw/2, y0 + ch*(.2 + s*.25)); g.lineTo(x - cw/2, y0 + ch*(.28 + s*.25)); g.closePath(); g.fill(); }
      g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 - u*.03); g.lineWidth = Math.max(2, u*.012); g.stroke(); g.lineWidth = Math.max(2, u*.014);
      if(c.lit){ var fl = 1 + Math.sin(now/90 + c.ph)*.1 + Math.sin(now/37 + c.ph*2)*.05, lean = blow*u*.04 + Math.sin(now/300 + c.ph)*u*.004, fy = y0 - u*.03, fh = u*.14*fl, fw = u*.045;
        var gg = g.createRadialGradient(x, fy - fh*.5, 0, x, fy - fh*.5, fh*1.3); gg.addColorStop(0, 'rgba(255,214,140,.5)'); gg.addColorStop(1, 'rgba(255,214,140,0)'); g.fillStyle = gg; g.beginPath(); g.arc(x, fy - fh*.5, fh*1.3, 0, TAU); g.fill();
        g.fillStyle = '#ffb02e'; g.beginPath(); g.moveTo(x, fy + fh*.06); g.bezierCurveTo(x - fw, fy - fh*.1, x - fw*.3 + lean*.3, fy - fh*.6, x + lean, fy - fh); g.bezierCurveTo(x + fw*.4 + lean*.3, fy - fh*.6, x + fw, fy - fh*.1, x, fy + fh*.06); g.fill();
        g.fillStyle = '#fff3b0'; g.beginPath(); g.ellipse(x + lean*.2, fy - fh*.3, fw*.3, fh*.26, 0, 0, TAU); g.fill(); } });
    // fumaça das velas apagadas
    for(i=smoke.length - 1;i>=0;i--){ var sm = smoke[i]; sm.t += dt; if(sm.t > 2.6){ smoke.splice(i, 1); continue; } if(sm.t < 0) continue;
      for(var p=0;p<5;p++){ var sp = Math.max(0, sm.t/2.6 - p*.06); if(sp <= 0) continue; g.fillStyle = 'rgba(210,210,225,' + (.5*(1 - sp)) + ')'; g.beginPath(); g.arc(sm.x + Math.sin(sp*7 + sm.ph + p)*u*(.012 + sp*.04), sm.y - sp*u*.55, u*(.012 + sp*.035), 0, TAU); g.fill(); } }
    // mesa rosa com bolinhas
    var ty = base; g.fillStyle = '#ff8fc6'; g.beginPath(); g.moveTo(-10, ty); g.lineTo(w + 10, ty); g.lineTo(w + 10, h + 10); g.lineTo(-10, h + 10); g.closePath(); g.fill(); g.strokeStyle = INK; g.lineWidth = Math.max(2, u*.014); g.beginPath(); g.moveTo(-10, ty); g.lineTo(w + 10, ty); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; for(i=0;i<40;i++){ g.beginPath(); g.arc(R01(i + 50)*w, ty + 14 + R01(i + 80)*(h - ty), u*.014 + R01(i)*u*.01, 0, TAU); g.fill(); }
    // mesmo prato por cima da toalha
    g.fillStyle = '#fff'; g.strokeStyle = INK; g.beginPath(); g.ellipse(cx, base + u*.005, u*.64, u*.06, 0, 0, TAU); g.fill(); g.stroke();
    // confete
    for(i=bits.length - 1;i>=0;i--){ var b = bits[i]; b.x += b.vx*dt; b.y += b.vy*dt; b.r += b.vr*dt; b.vx = b.vx*.99 + Math.sin(b.y*.02 + b.r)*2; if(b.y > h + 30){ bits.splice(i, 1); continue; }
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; if(b.s === 0) g.fillRect(-5, -2.5, 10, 5); else if(b.s === 1){ g.beginPath(); g.arc(0, 0, 3.5, 0, TAU); g.fill(); } else { g.beginPath(); for(var k=0;k<10;k++){ var rad = k % 2 ? 3 : 7, an = k/10*TAU; g.lineTo(Math.cos(an)*rad, Math.sin(an)*rad); } g.closePath(); g.fill(); } g.restore(); }
    return lit;
  }
  function loop(now){ if(!openN) return; raf = requestAnimationFrame(loop); var dt = Math.min(.05, (now - last)/1000 || 0); last = now;
    if(micAn){ micAn.getFloatTimeDomainData(micBuf); var s = 0; for(var i=0;i<micBuf.length;i++) s += micBuf[i]*micBuf[i]; var rms = Math.sqrt(s/micBuf.length); blow += (Math.max(0, Math.min(1, (rms - .05)/.2)) - blow)*.3; } else blow *= .9;
    if(blow > .15) CANDLES.forEach(function(c){ if(c.lit && Math.random() < blow*dt*4) putOut(c); });
    var lit = draw(now, dt);
    if(lit === 0 && !done){ done = true; doneAt = now; stopMic(); setTimeout(function(){ if(!openN || !done) return; party(); card.hidden = false; W.classList.add('fin'); }, 900); } }
  function fingerAt(e){ var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, u = Math.min(r.width*.66, r.height*.46); CANDLES.forEach(function(c){ if(c.lit && Math.hypot(c.x - x, c.y - y) < u*.12) putOut(c); }); }
  cv.addEventListener('pointerdown', function(e){ try{ cv.setPointerCapture(e.pointerId); }catch(_){} fingerAt(e); });
  cv.addEventListener('pointermove', function(e){ if(e.buttons || e.pointerType === 'touch') fingerAt(e); });
  micBtn.addEventListener('click', function(){
    if(micStream) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ note.textContent = 'Aqui não dá para usar o microfone — passe o dedo sobre as velinhas'; return; }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}).then(function(st){
      micStream = st; var AC = window.AudioContext || window.webkitAudioContext; ac = new AC(); var src = ac.createMediaStreamSource(st);
      micAn = ac.createAnalyser(); micAn.fftSize = 1024; micBuf = new Float32Array(micAn.fftSize); src.connect(micAn); micLabel.textContent = 'Pode soprar!'; note.textContent = 'sopre forte perto do celular';
    }).catch(function(){ note.textContent = 'Sem o microfone tudo bem — passe o dedo sobre as velinhas'; });
  });
  function stopMic(){ if(micStream){ micStream.getTracks().forEach(function(t){ t.stop(); }); micStream = null; micAn = null; try{ if(ac) ac.close(); }catch(_){} ac = null; micLabel.textContent = 'Soprar as velinhas'; } }
  function relight(){ CANDLES.forEach(function(c){ c.lit = true; }); smoke = []; bits = []; done = false; card.hidden = true; W.classList.remove('fin'); blow = 0; note.textContent = 'ou passe o dedo sobre as velinhas'; }
  function open(){ relight(); W.hidden = false; openN = true; size(); requestAnimationFrame(function(){ W.classList.remove('out'); }); last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  function close(cb){ openN = false; stopMic(); cancelAnimationFrame(raf); W.classList.add('out'); setTimeout(function(){ W.hidden = true; if(cb) cb(); }, 700); }
  window.__wishOpen = open;
  document.getElementById('wClose').addEventListener('click', function(){ close(); });
  document.getElementById('wAgain').addEventListener('click', relight);
  document.getElementById('wReplay').addEventListener('click', function(){ close(function(){ document.getElementById('startBtn').click(); }); });
  document.getElementById('wGame').addEventListener('click', function(){ close(function(){ if(window.__gameOpen) window.__gameOpen(); }); });
  var wl = document.getElementById('wishLink'); if(wl) wl.addEventListener('click', open);
  window.addEventListener('resize', function(){ if(openN) size(); });
})();

</script>
<script>
(function(){ var g = document.getElementById('gameLink'); if(g) g.addEventListener('click', function(){ window.__gameOpen && window.__gameOpen(); }); var c = document.getElementById('gClose'); if(c) c.addEventListener('click', function(){ window.__gameClose && window.__gameClose(); }); })();
</script>
